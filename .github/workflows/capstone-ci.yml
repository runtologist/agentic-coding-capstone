name: capstone-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  discover-projects:
    name: Discover capstone projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
      - name: Find Scala capstone projects (top-level dirs with build.sbt)
        id: find
        run: |
          projects=$(find . -mindepth 2 -maxdepth 2 -name build.sbt \
            -not -path './harness/*' -not -path './.git/*' \
            -exec dirname {} \; | sed 's|^\./||' | sort -u \
            | jq -R . | jq -s -c .)
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"

  capstone-tests:
    name: ${{ matrix.project }}
    needs: discover-projects
    if: needs.discover-projects.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover-projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt/Coursier artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ matrix.project }}-${{ hashFiles(format('{0}/build.sbt', matrix.project), format('{0}/project/**', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-sbt-${{ matrix.project }}-
            ${{ runner.os }}-sbt-

      - name: Format check, unit tests, assembly
        id: sbt
        working-directory: ${{ matrix.project }}
        run: |
          set -o pipefail
          sbt -batch -Dsbt.ci=true "scalafmtCheckAll; test; assembly" 2>&1 \
            | tee "${GITHUB_WORKSPACE}/sbt-${{ matrix.project }}.log"

      - name: Summarize sbt unit test results
        if: always()
        run: |
          LOG="${GITHUB_WORKSPACE}/sbt-${{ matrix.project }}.log"
          summary=""
          if [ -f "$LOG" ]; then
            summary="$(grep -E '[0-9]+ tests passed' "$LOG" | tail -1 || true)"
          fi
          echo "SBT RESULT (${{ matrix.project }}): ${summary:-no summary line found}"
          {
            echo "### ${{ matrix.project }} — sbt unit tests"
            echo ""
            echo "- ${summary:-**no summary line found — check sbt log artifact**}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.sbt.outcome }}" = "success" ] && [ -z "$summary" ]; then
            echo "::error::sbt step succeeded but no test summary line was found"
            exit 1
          fi

      - name: Check for vendored acceptance harness
        id: harness
        run: |
          if [ -f "harness/${{ matrix.project }}/run_tests" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.harness.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/${{ matrix.project }}/test-harness/package-lock.json

      - name: Install harness dependencies
        if: steps.harness.outputs.present == 'true'
        working-directory: harness/${{ matrix.project }}/test-harness
        run: npm ci

      - name: Run generic acceptance test suite
        id: harness-run
        if: steps.harness.outputs.present == 'true'
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          bash "harness/${{ matrix.project }}/run_tests" --lang scala \
            --implementation-root "${GITHUB_WORKSPACE}/${{ matrix.project }}" \
            2>&1 | tee "${GITHUB_WORKSPACE}/harness-${{ matrix.project }}.log"

      - name: Verify acceptance test results
        if: always() && steps.harness.outputs.present == 'true'
        run: |
          LOG="${GITHUB_WORKSPACE}/harness-${{ matrix.project }}.log"
          if [ ! -f "$LOG" ]; then
            if [ "${{ steps.harness-run.outcome }}" = "skipped" ]; then
              echo "harness step was skipped" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::harness log not found"
            exit 1
          fi
          expected=$(ls "harness/${{ matrix.project }}/tests"/*.yaml "harness/${{ matrix.project }}/tests"/*.yml 2>/dev/null | wc -l | tr -d ' ')
          summary="$(tail -5 "$LOG" | grep -E 'passed' | tail -1 || true)"
          passed="$(echo "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || true)"
          echo "HARNESS RESULT (${{ matrix.project }}): expected=${expected} passed=${passed:-?} summary='${summary:-missing}'"
          {
            echo "### ${{ matrix.project }} — acceptance harness"
            echo ""
            echo "- cases expected: ${expected}"
            echo "- cases passed: ${passed:-?}"
            echo "- summary line: \`${summary:-missing}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$summary" | grep -qE '^[0-9]+ failed'; then
            echo "::error::Acceptance harness reported failures"
            exit 1
          fi
          if [ -z "$passed" ] || [ "$passed" -lt "$expected" ]; then
            echo "::error::Expected ${expected} passing acceptance cases, got '${passed:-none}'"
            exit 1
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.project }}
          path: |
            sbt-${{ matrix.project }}.log
            harness-${{ matrix.project }}.log
          if-no-files-found: warn
