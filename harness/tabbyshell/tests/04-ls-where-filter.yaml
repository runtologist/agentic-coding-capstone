name: "ls | where size > 0b filters out empty files"
files:
  - path: empty.txt
    content: ""
  - path: full.txt
    content: "some content here"
script: |
  ls | where size > 0b
assertions:
  - type: exit_code
    value: 0
  - type: stdout_contains
    value: "full.txt"
  - type: stdout_not_contains
    value: "empty.txt"
