name: "to json renders structured data as JSON"
files:
  - path: people.csv
    content: |
      name,city
      Alice,Portland
script: |
  open people.csv | to json
assertions:
  - type: exit_code
    value: 0
  - type: stdout_contains
    value: '"name"'
  - type: stdout_contains
    value: '"Alice"'
