name: "Record renders as a 2-column key|value table"
files:
  - path: cfg.json
    content: |
      {"name":"tabbyshell","version":"0.1.0"}
script: |
  open cfg.json
assertions:
  - type: exit_code
    value: 0
  - type: stdout_equals
    value: |
      ╭─────────┬────────────╮
      │ key     │ value      │
      ├─────────┼────────────┤
      │ name    │ tabbyshell │
      │ version │ 0.1.0      │
      ╰─────────┴────────────╯
