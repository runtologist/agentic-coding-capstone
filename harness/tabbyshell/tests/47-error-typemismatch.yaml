name: "where on a non-table input produces TypeMismatch"
files:
  - path: notes.txt
    content: "hello"
script: |
  cat notes.txt | where x == 1
assertions:
  - type: exit_code
    value: 1
  - type: stderr_contains
    value: "where:"
  - type: stderr_contains
    value: "expected table"
  - type: stderr_contains
    value: "got string"
