name: "first 2 keeps only the first two rows"
files:
  - path: a.txt
    content: "1"
  - path: b.txt
    content: "2"
  - path: c.txt
    content: "3"
script: |
  ls | sort-by name | first 2 | select name
assertions:
  - type: exit_code
    value: 0
  - type: stdout_contains
    value: "a.txt"
  - type: stdout_contains
    value: "b.txt"
  - type: stdout_not_contains
    value: "c.txt"
